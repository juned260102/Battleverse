name: Battleverse Android Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Extract Battleverse project
        run: |
          mkdir project
          unzip -q Battleverse_Android_Project.zip -d project

      - name: Build APK and AAB
        working-directory: project
        run: |
          gradle assembleDebug
          gradle bundleRelease

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: Battleverse-Build
          path: |
            project/app/build/outputs/apk/debug/*.apk
            project/app/build/outputs/bundle/release/*.aab
